name: Infraestructura (Terraform)

# Ejecución manual: Actions -> Infraestructura -> Run workflow -> plan | apply | destroy
on:
  workflow_dispatch:
    inputs:
      action:
        description: Acción de Terraform
        type: choice
        options: [plan, apply, destroy]
        default: plan

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_region: ${{ vars.AWS_REGION || 'us-east-1' }}
  TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
  TF_VAR_github_repository: ${{ github.repository }}
  TF_IN_AUTOMATION: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=astro-defender/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: terraform plan
        if: inputs.action == 'plan'
        run: terraform plan -var-file=env/dev.tfvars

      - name: terraform apply
        if: inputs.action == 'apply'
        run: |
          terraform apply -auto-approve -var-file=env/dev.tfvars
          {
            echo "### Infraestructura lista"
            echo "- Clúster: \`$(terraform output -raw cluster_name)\`"
            echo "- API de líderes: $(terraform output -raw leaderboard_api_url)"
            echo "- CloudWatch: $(terraform output -raw cloudwatch_dashboard)"
            echo ""
            echo "Ahora ejecuta el workflow **Deploy** para publicar el juego."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: terraform destroy
        if: inputs.action == 'destroy'
        run: |
          bash ../scripts/predestroy.sh "$AWS_REGION" astro-defender || true
          terraform destroy -auto-approve -var-file=env/dev.tfvars
