name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Pruebas del juego y servicios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Servidor de juego
        run: npm ci --prefix server && npm test --prefix server
      - name: Lobby
        run: npm ci --prefix lobby && npm test --prefix lobby
      - name: Lambda tabla de líderes
        working-directory: lambda/leaderboard
        run: node --test
      - name: Prueba de humo end-to-end
        run: |
          node server/src/index.js &
          node lobby/src/index.js &
          for i in $(seq 1 20); do curl -sf localhost:8080/healthz && curl -sf localhost:7777/healthz && break; sleep 0.5; done
          node scripts/smoke-test.mjs

  docker:
    name: Construir imágenes Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -f server/Dockerfile -t astro-gameserver:ci .
      - run: docker build -f lobby/Dockerfile -t astro-lobby:ci .

  terraform:
    name: Validar Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  loadtest:
    name: Validar locustfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r loadtest/requirements.txt
      - run: python -m py_compile loadtest/locustfile.py
